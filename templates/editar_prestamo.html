{% extends "base.html" %}
{% block title %}Editar Solicitud — {{ cooperativa_nombre }}{% endblock %}

{% block content %}
<style>
  .ep-container { max-width: 600px; margin: 40px auto; }
  .ep-card { background: #fff; border-radius: 20px; border: 1px solid var(--c-border); box-shadow: var(--shadow-lg); overflow: hidden; }
  .ep-head { background: var(--c-blue); padding: 32px; color: #fff; text-align: center; }
  .ep-head h2 { font-family: 'Fraunces', serif; font-size: 24px; margin-bottom: 8px; }
  .ep-body { padding: 32px; }
  .ep-form { display: flex; flex-direction: column; gap: 20px; }
  .ep-group { display: flex; flex-direction: column; gap: 8px; }
  .ep-group label { font-size: 13px; font-weight: 600; color: var(--c-dark); }
  .ep-input { padding: 12px 16px; border: 1px solid var(--c-border); border-radius: 12px; font-size: 15px; background: var(--c-gray-light); transition: all 0.2s; }
  .ep-input:focus { background: #fff; border-color: var(--c-blue); outline: none; }
  .ep-actions { margin-top: 12px; display: flex; flex-direction: column; gap: 12px; }
</style>

<div class="ep-container">
  <div class="ep-card">
    <div class="ep-head">
      <h2>Editar Solicitud</h2>
      <p>Ajusta las condiciones para el préstamo <strong>{{ prestamo.numero }}</strong></p>
    </div>
    
    <div class="ep-body">
      <form method="post" class="ep-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div class="ep-group">
          <label>Asociado</label>
          <input type="text" class="ep-input" value="{{ prestamo.username or 'Socio' }}" readonly style="opacity:0.7;">
        </div>

        <div class="ep-group">
          <label for="categoria_id">Categoría</label>
          <select id="categoria_id" name="categoria_id" class="ep-input" required>
            {% for c in categorias %}
            <option value="{{ c.id }}" {% if prestamo.categoria_id == c.id %}selected{% endif %}>{{ c.nombre }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="ep-group">
          <label for="monto">Monto Solicitado (Q)</label>
          <input type="number" id="monto" name="monto" class="ep-input" value="{{ prestamo.monto_solicitado }}" step="100" required>
        </div>

        <div class="ep-group">
          <label for="tasa">Tasa de Interés (%)</label>
          <input type="number" id="tasa" name="tasa" class="ep-input" value="{{ prestamo.tasa_interes }}" step="0.1" required>
        </div>

        <div class="ep-group">
          <label for="plazo">Plazo (pagos)</label>
          <input type="number" id="plazo" name="plazo" class="ep-input" value="{{ prestamo.plazo_meses }}" required>
        </div>
        
        <div class="ep-actions">
          <button type="submit" class="btn btn-primary" style="width: 100%; min-height: 48px;">
            Actualizar Solicitud
          </button>
          <a href="{{ url_for('prestamos.detalle_prestamo', pid=prestamo.id) }}" class="btn btn-outline" style="width: 100%; min-height: 48px;">
            Cancelar
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
