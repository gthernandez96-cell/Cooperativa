{% extends "base.html" %}
{% block title %}Cambiar Contraseña — {{ cooperativa_nombre }}{% endblock %}

{% block content %}
<style>
  .nu-container { max-width: 540px; margin: 40px auto; }
  .nu-card { background: #fff; border-radius: 20px; border: 1px solid var(--c-border); box-shadow: var(--shadow-lg); overflow: hidden; }
  .nu-head { background: #111827; padding: 32px; color: #fff; text-align: center; }
  .nu-head h2 { font-family: 'Fraunces', serif; font-size: 24px; margin-bottom: 8px; }
  .nu-body { padding: 32px; }
  .nu-form { display: flex; flex-direction: column; gap: 20px; }
  .nu-group { display: flex; flex-direction: column; gap: 8px; }
  .nu-group label { font-size: 13px; font-weight: 600; color: var(--c-dark); }
  .nu-input { padding: 12px 16px; border: 1px solid var(--c-border); border-radius: 12px; font-size: 15px; background: var(--c-gray-light); transition: all 0.2s; }
  .nu-input:focus { background: #fff; border-color: var(--c-blue); outline: none; }
  .nu-actions { margin-top: 12px; display: flex; flex-direction: column; gap: 12px; }
</style>

<div class="nu-container">
  <div class="nu-card">
    <div class="nu-head" style="background:#4b5563;">
      <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="margin-bottom:12px; opacity:0.8;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <h2>Cambiar Contraseña</h2>
      <p>Actualiza el acceso para <strong>{{ user.username }}</strong></p>
    </div>
    
    <div class="nu-body">
      <form method="post" class="nu-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div class="nu-group">
          <label for="password">Nueva Contraseña</label>
          <input type="password" id="password" name="password" class="nu-input" placeholder="••••••••" required autofocus>
        </div>

        <div class="nu-group">
          <label for="confirm_password">Confirmar Nueva Contraseña</label>
          <input type="password" id="confirm_password" name="confirm_password" class="nu-input" placeholder="••••••••" required>
        </div>
        
        <div class="nu-actions">
          <button type="submit" class="btn btn-primary" style="width: 100%; min-height: 48px; background: #4b5563; border-color: #374151;">
            Actualizar Contraseña
          </button>
          <a href="{{ url_for('usuarios.usuarios') }}" class="btn btn-outline" style="width: 100%; min-height: 48px;">
            Cancelar
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
